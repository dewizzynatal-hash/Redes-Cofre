<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1976d2"
    >

    <title>Meu Bloco de Notas</title>
    <link rel="manifest" href="manifest.json">

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================
         TELA DE PIN
    ========================== -->

    <div id="telaPIN" class="telaPIN">

        <div class="caixaPIN">

            <div class="iconeCadeado">
                🔐
            </div>

            <h1>Meu Bloco de Notas</h1>

            <p id="textoPIN">
                Digite o seu PIN
            </p>

            <input
                type="password"
                id="campoPIN"
                inputmode="numeric"
                maxlength="6"
                placeholder="PIN"
            >

            <button
                class="botaoPrincipal"
                onclick="entrar()"
            >
                Entrar
            </button>

            <p
                id="mensagemPIN"
                class="mensagemPIN"
            ></p>

        </div>

    </div>


    <!-- =========================
         APLICAÇÃO
    ========================== -->

    <div id="aplicacao" class="aplicacao">

        <header>

            <div>
                <h1>Meu Bloco de Notas</h1>
                <p id="contadorNotas">
                    0 notas
                </p>
            </div>

            <button
                class="botaoBloquear"
                onclick="bloquearAplicacao()"
                title="Bloquear"
            >
                🔒
            </button>

        </header>


        <main>

            <!-- PESQUISA -->

            <div class="pesquisa">

                <span>🔍</span>

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar notas..."
                >

            </div>


            <!-- LISTA DE NOTAS -->

            <div id="listaNotas">

            </div>

        </main>


        <!-- BOTÃO ADICIONAR -->

        <button
            class="botaoAdicionar"
            onclick="abrirNovaNota()"
        >
            +
        </button>

    </div>


    <!-- =========================
         NOVA NOTA
    ========================== -->

    <div
        id="telaNovaNota"
        class="modal"
    >

        <div class="modalConteudo">

            <div class="cabecalhoModal">

                <h2>Nova Nota</h2>

                <button
                    onclick="fecharNovaNota()"
                    class="botaoFechar"
                >
                    ×
                </button>

            </div>


            <label>Nome da nota</label>

            <input
                type="text"
                id="titulo"
                placeholder="Ex.: Instagram"
            >


            <label>Nome de usuário</label>

            <input
                type="text"
                id="usuario"
                placeholder="Nome de usuário"
            >


            <label>E-mail</label>

            <input
                type="email"
                id="email"
                placeholder="exemplo@email.com"
            >


            <label>Palavra-passe</label>

            <div class="campoSenha">

                <input
                    type="password"
                    id="senha"
                    placeholder="Palavra-passe"
                >

                <button
                    onclick="alternarSenha('senha', this)"
                >
                    👁
                </button>

            </div>


            <label>Número</label>

            <input
                type="tel"
                id="numero"
                placeholder="+258..."
            >


            <label>Observações</label>

            <textarea
                id="observacoes"
                placeholder="Escreva alguma observação..."
            ></textarea>


            <button
                class="botaoPrincipal"
                onclick="guardarNota()"
            >
                Guardar Nota
            </button>

        </div>

    </div>


    <!-- =========================
         DETALHES DA NOTA
    ========================== -->

    <div
        id="telaDetalhes"
        class="modal"
    >

        <div class="modalConteudo">

            <div class="cabecalhoModal">

                <h2 id="detalhesTitulo">
                    Nota
                </h2>

                <button
                    onclick="fecharDetalhes()"
                    class="botaoFechar"
                >
                    ×
                </button>

            </div>


            <div class="informacao">

                <span>Nome de usuário</span>

                <div class="linhaInformacao">

                    <p id="detalhesUsuario">
                        -
                    </p>

                    <button
                        onclick="copiarTexto('detalhesUsuario')"
                    >
                        📋
                    </button>

                </div>

            </div>


            <div class="informacao">

                <span>E-mail</span>

                <div class="linhaInformacao">

                    <p id="detalhesEmail">
                        -
                    </p>

                    <button
                        onclick="copiarTexto('detalhesEmail')"
                    >
                        📋
                    </button>

                </div>

            </div>


            <div class="informacao">

                <span>Palavra-passe</span>

                <div class="linhaInformacao">

                    <input
                        type="password"
                        id="detalhesSenha"
                        readonly
                    >

                    <button
                        onclick="alternarSenha('detalhesSenha', this)"
                    >
                        👁
                    </button>

                    <button
                        onclick="copiarTexto('detalhesSenha')"
                    >
                        📋
                    </button>

                </div>

            </div>


            <div class="informacao">

                <span>Número</span>

                <div class="linhaInformacao">

                    <p id="detalhesNumero">
                        -
                    </p>

                    <button
                        onclick="copiarTexto('detalhesNumero')"
                    >
                        📋
                    </button>

                </div>

            </div>


            <div class="informacao">

                <span>Observações</span>

                <p id="detalhesObservacoes">
                    -
                </p>

            </div>


            <div class="botoesAcao">

                <button
                    class="botaoEditar"
                    onclick="editarNotaAtual()"
                >
                    ✏️ Editar
                </button>

                <button
                    class="botaoApagar"
                    onclick="apagarNotaAtual()"
                >
                    🗑️ Apagar
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>
</html>
